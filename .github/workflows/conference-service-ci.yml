name: Conference Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/conference-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/conference-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/conference-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --console=plain
