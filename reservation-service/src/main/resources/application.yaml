server:
  port: 8083

spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:mysql://localhost:3306/reservation_service
    username: ${RESERVATION_DB_USER:reservation_svc}
    password: ${RESERVATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true