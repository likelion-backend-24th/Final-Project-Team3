server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: conference-service
  datasource:
    url: jdbc:mysql://localhost:3306/conference_service
    username: ${CONFERENCE_DB_USER:conference_svc}
    password: ${CONFERENCE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      # 증빙 파일 + 대표 이미지를 같은 요청에 동시에 첨부할 수 있어서(각 최대 10MB),
      # 요청 전체 한도는 파일 하나 한도보다 넉넉하게 잡는다.
      max-request-size: 25MB

app:
  upload:
    conference-proof-dir: ${CONFERENCE_PROOF_UPLOAD_DIR:uploads/conference-proof}
    conference-image-dir: ${CONFERENCE_IMAGE_UPLOAD_DIR:uploads/conference-image}

services:
  reservation-service:
    url: http://localhost:8083

gemini:
  api-key: ${GEMINI_API_KEY}
  api-base-url: https://generativelanguage.googleapis.com

llm:
  summary:
    attendee-stats:
      model: gemini-3.6-flash
    content:
      model: gemini-3.6-flash