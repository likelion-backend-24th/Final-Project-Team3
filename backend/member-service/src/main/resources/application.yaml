server:
  port: 8081
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:mysql://localhost:3306/member_service
    username: ${MEMBER_DB_USER:member_svc}
    password: ${MEMBER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000         # 30 분
  refresh-token-validity-ms: 1209600000     # 14일
cookie:
  secure: ${COOKIE_SECURE:false}            # 운영 배포 시 COOKIE_SECURE=true 로 오버라이드
  same-site: ${COOKIE_SAMESITE:Lax}         # 프론트가 다른 도메인이면 COOKIE_SECURE=true와 함께 None으로 명시적 오버라이드
email:
  verification-code-validity-ms: 600000     # 10분
  max-attempts: 5                           # 검증 실패 허용 횟수