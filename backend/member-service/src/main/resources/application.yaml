server:
  port: 8081
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:mysql://localhost:3306/member_service
    username: ${MEMBER_DB_USER:member_svc}
    password: ${MEMBER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000         # 30 분
  refresh-token-validity-ms: 1209600000     # 14일
cookie:
  secure: ${COOKIE_SECURE:false}            # 운영 배포 시 COOKIE_SECURE=true 로 오버라이드
  same-site: ${COOKIE_SAMESITE:None}        # 프론트가 같은 도메인으로 오면 Lax/Strict로 오버라이드