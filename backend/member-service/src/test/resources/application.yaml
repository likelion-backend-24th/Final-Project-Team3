spring:
  datasource:
    url: jdbc:h2:mem:member_service;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: test-only-secret-key-for-member-service-please-rotate-1234
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000
