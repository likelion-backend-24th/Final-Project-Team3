# 프로덕션 전용 nginx 설정. frontend 이미지에 baked-in된 nginx.conf(80 only) 대신
# compose.prod.yaml이 이 파일을 /etc/nginx/conf.d/default.conf로 덮어써서 사용한다.
# (로컬 개발은 이 파일과 무관 - frontend/nginx.conf 그대로 사용)
#
# 인증서 발급(certbot) 전에는 /etc/letsencrypt/live/techconf.duckdns.org/ 안에 인증서 파일이
# 없어서 443 서버 블록이 있는 이 설정 그대로는 nginx가 기동 실패한다.
# 최초 1회는 더미 자체서명 인증서로 nginx를 띄운 뒤 certbot으로 실제 인증서를 발급받아야 한다
# (server 배포 안내 메시지의 명령 순서 참고).
server {
    listen 80;
    server_name techconf.duckdns.org;

    # certbot webroot 챌린지 - 갱신(renew) 때도 계속 이 경로로 검증하므로 리다이렉트 예외 처리
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name techconf.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/techconf.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techconf.duckdns.org/privkey.pem;

    # 게이트웨이가 /api/** 로 라우트를 그대로 받으니 prefix를 잘라내지 않고 통째로 전달한다
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
