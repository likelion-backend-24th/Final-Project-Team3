# 프로덕션 배포용 오버라이드.
# 로컬 개발은 compose.yaml만 사용(소스에서 직접 build).
# 서버 배포는 GitHub Actions가 미리 빌드해 GHCR에 올린 이미지를 pull만 하도록
# 아래 명령으로 이 파일을 함께 사용한다:
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  gateway:
    image: ghcr.io/likelion-backend-24th/final-project-team3-gateway:latest

  member-service:
    image: ghcr.io/likelion-backend-24th/final-project-team3-member-service:latest
    environment:
      # 운영은 Nginx가 HTTPS를 처리하므로 Refresh Token 쿠키에 Secure를 붙여 HTTPS 요청에만 실리게 한다.
      # (로컬 compose.yaml은 http://localhost라 기본값 false 유지)
      COOKIE_SECURE: "true"

  conference-service:
    image: ghcr.io/likelion-backend-24th/final-project-team3-conference-service:latest

  reservation-service:
    image: ghcr.io/likelion-backend-24th/final-project-team3-reservation-service:latest

  frontend:
    image: ghcr.io/likelion-backend-24th/final-project-team3-frontend:latest
    ports:
      - "443:443"
    volumes:
      # 이미지에 baked-in된 80-only 설정 대신 HTTPS(443) + acme-challenge 설정으로 덮어씀
      - ./nginx/frontend-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  # 인증서 발급/갱신 전용. 평소엔 떠 있을 필요 없고 필요할 때만
  # `docker compose -f compose.yaml -f compose.prod.yaml run --rm certbot ...` 로 실행한다.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
