services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ../backend/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVICES_MEMBER_SERVICE_URL: http://member-service:8081
      SERVICES_CONFERENCE_SERVICE_URL: http://conference-service:8082
      SERVICES_RESERVATION_SERVICE_URL: http://reservation-service:8083
    depends_on:
      - member-service
      - conference-service
      - reservation-service

  member-service:
    build: ../backend/member-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/member_service
      MEMBER_DB_USER: ${MEMBER_DB_USER}
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY}
      SOCIAL_MODE: ${SOCIAL_MODE:-mock}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      SERVICES_CONFERENCE_SERVICE_URL: http://conference-service:8082
    depends_on:
      mysql:
        condition: service_healthy

  conference-service:
    build: ../backend/conference-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/conference_service
      CONFERENCE_DB_USER: ${CONFERENCE_DB_USER}
      CONFERENCE_DB_PASSWORD: ${CONFERENCE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERVICES_RESERVATION_SERVICE_URL: http://reservation-service:8083
      CONFERENCE_PROOF_UPLOAD_DIR: /app/uploads/conference-proof
      CONFERENCE_IMAGE_UPLOAD_DIR: /app/uploads/conference-image
    volumes:
      # 컨테이너가 재배포돼도(docker compose up -d) 증명 파일·이미지가 유지되도록 호스트에 마운트
      - ./uploads/conference-proof:/app/uploads/conference-proof
      - ./uploads/conference-image:/app/uploads/conference-image
    depends_on:
      mysql:
        condition: service_healthy

  reservation-service:
    build: ../backend/reservation-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reservation_service
      RESERVATION_DB_USER: ${RESERVATION_DB_USER}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      SERVICES_CONFERENCE_SERVICE_URL: http://conference-service:8082
      JWT_SECRET: ${JWT_SECRET}
      PG_CREDENTIAL_ENCRYPTION_KEY: ${PG_CREDENTIAL_ENCRYPTION_KEY}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY:-}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  mysql_data: